<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JARVIS HUD</title>
<style>
:root{
  --b0:#05080f; --b1:#0a101c; --b2:#0f1726; --b3:#16203a; --b4:#1e2c4d;
  --t0:#eef3fb; --t1:#9fb3d0; --t2:#5e7191;
  --ok:#2de0a4; --warn:#ffb454; --fail:#ff5d73; --acc:#38e8c1; --acc2:#4cc9f0;
  --mono:'JetBrains Mono','Cascadia Mono',Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:radial-gradient(900px 420px at 75% -8%,#12233e 0%,var(--b0) 60%);
  color:var(--t0);font-family:'Segoe UI',system-ui,sans-serif;font-size:13px}
#app{display:grid;grid-template-rows:52px 128px 1fr 150px;height:100vh;gap:8px;padding:10px}

/* ---------- top ---------- */
header{display:flex;align-items:center;gap:12px;padding:0 16px;border:1px solid #1c2b47;border-radius:14px;
  background:linear-gradient(90deg,#0d1524,#0a101d)}
.logo{font-family:var(--mono);font-weight:700;letter-spacing:2px;font-size:16px}
.logo .j{color:var(--acc)} .logo .h{color:var(--t2)}
.state{margin-inline-start:auto;display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--t2)}
.state b{color:var(--acc2);font-weight:600}
.mode{display:flex;gap:4px}
.mode button{background:var(--b2);color:var(--t1);border:1px solid #26395c;border-radius:8px;padding:4px 12px;cursor:pointer;font-size:11px}
.mode button.on{background:#10352a;color:var(--ok);border-color:#2a6b46}
.gh button,.gh{background:transparent;border:1px solid #223;color:var(--t2);border-radius:8px;padding:4px 10px;font-size:11px;cursor:pointer}

/* ---------- telemetry ---------- */
#tel{display:grid;grid-template-columns:150px 150px 1fr 1fr 150px;gap:8px}
.tcard{background:rgba(10,16,28,.75);border:1px solid #1c2b47;border-radius:14px;padding:8px 10px;position:relative;overflow:hidden}
.tcard .lb{font-size:10px;letter-spacing:1px;color:var(--t2);text-transform:uppercase}
.tcard .v{font-family:var(--mono);font-weight:700;font-size:22px;margin-top:2px}
.tcard .v small{font-size:10px;color:var(--t1);font-weight:400}
.tcard .sub{font-family:var(--mono);font-size:11px;color:var(--t1);margin-top:2px}
.tcard .bar{height:5px;background:#14203a;border-radius:3px;margin-top:6px;overflow:hidden}
.tcard .bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--acc2),var(--acc));transition:width .8s}
.tcard.dash .v{color:var(--t2)}
.ringwrap{display:flex;align-items:center;gap:8px}
.ring{position:relative;width:52px;height:52px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .rv{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;font-size:11px}
#procs{grid-column:3/6;font-family:var(--mono);font-size:11px;color:var(--t1);line-height:1.8;display:flex;flex-wrap:wrap;gap:0 18px;align-content:start}
#procs span{white-space:nowrap}
#procs b{color:var(--t0);font-weight:600}
#procs .none{color:var(--t2)}

/* ---------- bottom work + actions ---------- */
#mid{display:grid;grid-template-columns:1fr 390px;gap:8px;min-height:0}
.panel{background:rgba(10,16,28,.75);border:1px solid #1c2b47;border-radius:14px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.phead{display:flex;align-items:center;gap:14px;padding:7px 14px;border-bottom:1px solid #162238}
.phead h3{font-size:11px;letter-spacing:1px;color:var(--t2);font-weight:600}
.phead button{background:transparent;border:0;color:var(--t2);padding:3px 10px;border-radius:8px;cursor:pointer;font-size:11px}
.phead button.on{color:var(--acc);background:#0c1c22}
.pbody{flex:1;overflow:auto;min-height:0}

#feed{padding:10px 14px}
.msg{margin:8px 0;max-width:94%;padding:10px 13px;border-radius:14px;font-size:13px;line-height:1.7;white-space:pre-wrap}
.msg.user{background:#17365e;border-bottom-right-radius:4px;margin-inline-start:auto}
.msg.jv{background:#0e1830;border:1px solid #22395e;border-bottom-left-radius:4px}
.msg.jv .tag{color:var(--acc);font-family:var(--mono);font-size:10px;display:block;margin-bottom:3px}
.msg.fail{background:#2a1420;border-color:#6e2a3c}
.msg h4{color:var(--t1);font-size:12px;margin-bottom:4px}
.msg .report{display:inline-block;margin-top:8px;font-size:11px;font-family:var(--mono);color:#9ad8ff;border:1px solid #26497e;border-radius:6px;padding:3px 9px;text-decoration:none}
.msg .blk{animation:blink 1.1s infinite}
@keyframes blink{50%{opacity:.35}}

/* terminal */
#term{padding:6px 10px;font-family:var(--mono);font-size:11px}
.te{border-bottom:1px solid #131f36;padding:5px 4px}
.te .c{color:var(--acc2)}
.te .o{color:#c9d9f0;white-space:pre-wrap;direction:ltr;text-align:left;margin-top:3px;background:#070d18;border-radius:6px;padding:4px 8px;max-height:140px;overflow:auto}
.te .x{color:var(--fail)}
.te .ts{color:var(--t2);font-size:10px;margin-inline-end:6px}
.te.empty{color:var(--t2);text-align:center;padding:20px}

/* actions */
#acts{padding:6px 10px}
.acard{border:1px solid #22375c;border-left:3px solid var(--t2);border-radius:10px;padding:7px 10px;margin:6px 0;background:#0c141f}
.acard.run{border-left-color:var(--warn)}
.acard.ok{border-left-color:var(--ok)}
.acard.fail{border-left-color:var(--fail)}
.acard .row{display:flex;gap:8px;align-items:baseline;font-family:var(--mono);font-size:11px}
.acard .tool{color:var(--acc2);font-weight:700}
.acard .why{color:var(--t1);font-size:11px;margin-top:3px}
.acard .out{color:#cfe3ff;font-size:11px;font-family:var(--mono);margin-top:4px;max-height:70px;overflow:auto;white-space:pre-wrap;direction:ltr;text-align:left;background:#081019;padding:4px 7px;border-radius:6px}
.acard .err{color:var(--fail)}
.acard .ap{display:flex;gap:8px;margin-top:7px}
.acard .ap button{flex:1;padding:6px;border-radius:8px;border:0;font-weight:700;cursor:pointer;font-size:12px}
.ap .yes{background:var(--ok);color:#03281a}.ap .no{background:var(--fail);color:#2b0208}
.st{font-size:9px;padding:1px 6px;border-radius:5px;letter-spacing:1px}
.st.b{color:var(--warn);background:#24200f}.st.g{color:#041b12;background:#18d5a0}.st.r{color:#fff;background:#c22b42}

/* sessions / memory / settings */
table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:10.5px}
td,th{text-align:right;padding:4px 8px;border-bottom:1px solid #131f36;color:var(--t1);font-family:inherit}
th{color:var(--t2);font-weight:600}
td.g{color:var(--ok)}td.b{color:var(--fail)}
.fact{display:flex;align-items:center;gap:8px;font-size:12px;padding:5px 10px;border-bottom:1px solid #141f36;color:var(--t1)}
.fact button{background:#2b1620;color:var(--fail);border:0;border-radius:6px;cursor:pointer;padding:2px 8px}
#memadd{display:flex;gap:6px;padding:8px 10px}
#memadd input,#set input,#set select{flex:1;background:#0b1420;border:1px solid #24385c;color:var(--t0);border-radius:8px;padding:7px;font-family:inherit}
#memadd button,#set .row button{background:var(--b3);color:var(--acc);border:0;border-radius:8px;padding:0 14px;cursor:pointer}
#set{padding:10px}
#set .row{display:flex;gap:8px;margin:8px 0;align-items:center}
#set .row label{color:var(--t1);font-size:12px;min-width:120px}
#set .hint{color:var(--t2);font-size:10.5px;line-height:1.6}

/* ---------- bottom: input + floats ---------- */
#ctl{display:flex;gap:8px;align-items:stretch}
textarea{flex:1;resize:none;background:#0b1420;border:1px solid #24385c;border-radius:12px;color:var(--t0);padding:10px 12px;font-family:inherit;font-size:13px}
textarea:focus{outline:none;border-color:var(--acc2)}
#send,#mic{border:0;border-radius:12px;font-weight:700;cursor:pointer}
#send{background:linear-gradient(135deg,#16c79a,#0ea5e9);color:#02160f;padding:0 26px;font-size:13px}
#send:disabled{opacity:.4;cursor:not-allowed}
#mic{background:var(--b3);color:var(--t1);width:46px;font-size:12px}
#mic.live{background:#3a1a1a;color:var(--fail)}

/* floating windows (weather / firewall) */
.float{position:fixed;z-index:50;border:1px solid #2a3f6b;border-radius:14px;background:rgba(8,13,24,.92);
  box-shadow:0 12px 40px #000a;min-width:210px;backdrop-filter:blur(6px)}
.float .fh{cursor:grab;display:flex;align-items:center;justify-content:space-between;padding:7px 12px;border-bottom:1px solid #1c2b47;font-family:var(--mono);font-size:11px;color:var(--t2);user-select:none}
.float .fh .x{cursor:pointer;color:var(--fail);padding:0 6px}
.float .fb{padding:10px 14px;font-size:12px;color:var(--t1)}
.float .fb b{color:var(--t0);font-family:var(--mono);font-size:18px}
.float .fb .okok{color:var(--ok)} .float .fb .nooff{color:var(--fail)}
#wbox{top:300px;left:24px}#fbox{top:300px;left:260px}
@media(max-width:1050px){#mid{grid-template-columns:1fr}#tel{grid-template-columns:1fr 1fr}#procs{grid-column:1/3}}

/* ---------- reactor + boot ---------- */
#core{position:relative;width:26px;height:26px;flex:none;border-radius:50%;
  background:radial-gradient(circle at 50% 50%,#0a2230,#05080f 72%);
  box-shadow:0 0 0 1px #1d4a5e inset,0 0 10px rgba(76,201,240,.35);transition:box-shadow .3s}
#core::before,#core::after{content:'';position:absolute;border-radius:50%}
#core::before{inset:5px;border:2px solid var(--acc2);border-top-color:transparent;border-bottom-color:transparent;animation:spin 3.4s linear infinite}
#core::after{inset:9px;background:var(--acc2);box-shadow:0 0 8px var(--acc2);animation:core 3.4s ease-in-out infinite}
#core.work{box-shadow:0 0 0 1px #6b4a1c inset,0 0 14px rgba(255,180,84,.5)}
#core.work::before{border-color:var(--warn);border-top-color:transparent;border-bottom-color:transparent;animation-duration:.9s}
#core.work::after{background:var(--warn);box-shadow:0 0 10px var(--warn);animation-duration:.45s}
#core.ok::after{background:var(--ok);box-shadow:0 0 12px var(--ok);animation:none}
#core.fail::after{background:var(--fail);box-shadow:0 0 14px var(--fail);animation:none}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes core{0%,100%{opacity:.3;transform:scale(.75)}50%{opacity:1;transform:scale(1.05)}}

#boot{position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  background:radial-gradient(760px 420px at 50% 42%,#0d1c30 0%,#04070d 68%);transition:opacity .7s}
#boot.gone{opacity:0;pointer-events:none}
#boot .big{position:relative;width:132px;height:132px}
#boot .big i{position:absolute;border-radius:50%;border:2px solid rgba(76,201,240,.5)}
#boot .big i:nth-child(1){inset:0;border-top-color:transparent;animation:spin 2.6s linear infinite}
#boot .big i:nth-child(2){inset:14px;border-bottom-color:transparent;border-left-color:transparent;animation:spin 1.8s linear infinite reverse}
#boot .big i:nth-child(3){inset:30px;border-color:transparent;border-top-color:var(--acc2);animation:spin 1.2s linear infinite}
#boot .big b{position:absolute;inset:44px;border-radius:50%;background:radial-gradient(circle,#0ffb,#0a2a3a 70%,transparent);box-shadow:0 0 22px rgba(76,201,240,.55)}
#boot .ln{width:min(600px,86vw);font-family:var(--mono);font-size:12px;color:var(--t1);line-height:2.05;min-height:132px;white-space:pre-wrap}
#boot .ln .k{color:var(--acc2)}#boot .ln .g{color:var(--ok)}#boot .ln .r{color:var(--fail)}
</style>
</head>
<body>
<div id="boot">
  <div class="big"><i></i><i></i><i></i><b></b></div>
  <div class="ln" id="bootln"></div>
</div>
<div id="app">
  <header>
    <div id="core" title="نواة الحالة"></div>
    <div class="logo"><span class="j">JARVIS</span><span class="h">·HUD</span></div>
    <div class="state">الشبكة: <b id="sock">متصل</b></div>
    <div class="mode" id="modes">
      <button data-auto="ask" class="on">آسك</button>
      <button data-auto="allow">فوري</button>
      <button data-auto="deny">آمن</button>
    </div>
    <button class="gh" id="feng">المحرك: نواة</button>
    <button class="gh" id="fsound">الصوت: تشغيل</button>
    <button class="gh" id="fclose">إغلاق النوافذ</button>
  </header>

  <div id="tel">
    <div class="tcard" id="cpu">
      <div class="lb">المعالج</div>
      <div class="ringwrap">
        <div class="ring"><svg width="52" height="52"><circle cx="26" cy="26" r="21" fill="none" stroke="#15213c" stroke-width="5"/><circle id="cpuArc" cx="26" cy="26" r="21" fill="none" stroke="#4cc9f0" stroke-width="5" stroke-linecap="round" stroke-dasharray="132" stroke-dashoffset="132"/></svg><div class="rv" id="cpuV">—</div></div>
        <div class="v" id="cpuP">—</div>
      </div>
    </div>
    <div class="tcard" id="ram">
      <div class="lb">الذاكرة</div>
      <div class="ringwrap">
        <div class="ring"><svg width="52" height="52"><circle cx="26" cy="26" r="21" fill="none" stroke="#15213c" stroke-width="5"/><circle id="ramArc" cx="26" cy="26" r="21" fill="none" stroke="#2de0a4" stroke-width="5" stroke-linecap="round" stroke-dasharray="132" stroke-dashoffset="132"/></svg><div class="rv" id="ramP">—</div></div>
        <div class="v" id="ramV">—</div>
      </div>
      <div class="sub" id="ramSub">—</div>
    </div>
    <div class="tcard" id="dsk">
      <div class="lb">القرص</div>
      <div class="v" id="dskV">—</div>
      <div class="bar"><i id="dskB" style="width:0%"></i></div>
      <div class="sub" id="dskSub">—</div>
    </div>
    <div class="tcard">
      <div class="lb">الشبكة · التشغيل</div>
      <div><span class="v" id="netIn" style="font-size:17px">—</span><span class="sub"> ⇣ </span><span class="v" id="netOut" style="font-size:17px">—</span><span class="sub"> ⇡ بايت/ث</span></div>
      <div class="sub" id="upT">عمر التشغيل: —</div>
    </div>
    <div class="tcard" id="procs"><div class="lb none" style="grid-column:1/5">عمليات الأعلى · لا قراءة —</div></div>
  </div>

  <div id="mid">
    <div class="panel">
      <div class="phead">
        <h3>نافذة العمل</h3>
        <button data-t="feed" class="on">الحوار</button>
        <button data-t="term">الطرفية</button>
        <button data-t="ses">الجلسات</button>
        <button data-t="mem">الذاكرة</button>
        <button data-t="set">الإعدادات</button>
      </div>
      <div class="pbody">
        <div id="feed"><div class="msg jv">انتظر… جارٍ تدفئة العقل.</div></div>
        <div id="term" style="display:none"></div>
        <div id="ses" style="display:none"><table><thead><tr><th>الجلسة</th><th>المهمة</th><th>خطوات ✓</th><th>✗</th><th>الحكم</th></tr></thead><tbody></tbody></table></div>
        <div id="mem" style="display:none"></div>
        <div id="set" style="display:none"></div>
      </div>
    </div>
    <div class="panel">
      <div class="phead"><h3>أثر التنفيذ الحي — دليل لا ادعاء</h3><span class="gh" id="runb" style="margin-inline-start:auto;color:var(--warn)">واقف</span></div>
      <div class="pbody" id="acts"></div>
    </div>
  </div>

  <div id="ctl">
    <textarea id="in" rows="2" placeholder="مهمة حقيقية…: اصنع ملفًا، اقرأ مجلدًا، حلّل كودًا، ابحث في الشبكة، ثبّت شيئًا — لا كلام بلا أداة."></textarea>
    <button id="send">أرسِل</button>
    <button id="mic">MIC</button>
  </div>
</div>

<div class="float" id="wbox">
  <div class="fh">طقس <span class="x" data-close="wbox">×</span></div>
  <div class="fb" id="wbody">قياس…</div>
</div>
<div class="float" id="fbox">
  <div class="fh">جدار ناري <span class="x" data-close="fbox">×</span></div>
  <div class="fb" id="fbody">قياس…</div>
</div>
<script src="/app.js"></script>
</body>
</html>
