<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Agent OS · مركز التحكم</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@200;300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --void:#060912;
    --deep:#0a0f1f;
    --deep2:#0d1428;
    --panel:rgba(19,28,53,.55);
    --panel-solid:#111a30;
    --line:rgba(122,160,255,.12);
    --line-strong:rgba(122,160,255,.22);
    --cyan:#34e5ff;
    --cyan-dim:#1c9fc0;
    --violet:#9d7bff;
    --gold:#f6c453;
    --emerald:#37e0a0;
    --coral:#ff6b8a;
    --text:#e8eeff;
    --muted:#8a97bd;
    --muted-dim:#5c6786;
    --ar:'IBM Plex Sans Arabic',system-ui,sans-serif;
    --num:'Space Grotesk','IBM Plex Sans Arabic',sans-serif;
    --sb:288px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:var(--ar);
    background:var(--void);
    color:var(--text);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
    line-height:1.6;
  }
  #bg3d{position:fixed;inset:0;z-index:0;display:block}
  .glow-layer{
    position:fixed;inset:0;z-index:1;pointer-events:none;
    background:
      radial-gradient(1100px 700px at 78% -10%, rgba(52,229,255,.10), transparent 60%),
      radial-gradient(900px 600px at 10% 110%, rgba(157,123,255,.10), transparent 60%),
      radial-gradient(700px 500px at 50% 50%, rgba(10,15,31,.0), rgba(6,9,18,.55) 90%);
  }
  ::selection{background:rgba(52,229,255,.28);color:#fff}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:rgba(122,160,255,.18);border-radius:20px;border:2px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-thumb:hover{background:rgba(122,160,255,.32);background-clip:content-box}

  /* ===== SHELL ===== */
  .shell{position:relative;z-index:2;height:100vh;display:grid;grid-template-columns:var(--sb) 1fr;grid-template-rows:64px 1fr;grid-template-areas:"top top" "side main"}
  .topbar{grid-area:top;display:flex;align-items:center;gap:18px;padding:0 22px;border-bottom:1px solid var(--line);background:rgba(8,12,24,.62);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
  .brand{display:flex;align-items:center;gap:12px;margin-inline-start:auto}
  .brand .mark{width:34px;height:34px;border-radius:10px;position:relative;display:grid;place-items:center;background:linear-gradient(140deg,rgba(52,229,255,.25),rgba(157,123,255,.25));border:1px solid var(--line-strong);box-shadow:0 0 22px rgba(52,229,255,.28), inset 0 0 14px rgba(52,229,255,.15)}
  .brand .mark::after{content:"";width:12px;height:12px;border-radius:50%;background:radial-gradient(circle,#fff,var(--cyan) 60%,transparent);box-shadow:0 0 12px var(--cyan)}
  .brand b{font-weight:700;font-size:15px;letter-spacing:.2px}
  .brand span{font-size:11px;color:var(--muted);font-family:var(--num)}
  .tb-stat{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);padding:6px 12px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.02)}
  .tb-stat b{color:var(--text);font-weight:600;font-family:var(--num)}
  .tb-stat .dot{width:7px;height:7px;border-radius:50%;background:var(--emerald);box-shadow:0 0 10px var(--emerald)}
  .tb-clock{font-family:var(--num);font-size:13px;color:var(--muted);letter-spacing:.5px}
  .live-pill{display:flex;align-items:center;gap:7px;font-size:12px;padding:6px 13px;border-radius:20px;background:rgba(55,224,160,.08);border:1px solid rgba(55,224,160,.28);color:var(--emerald);font-weight:600}
  .live-pill .pulse{width:7px;height:7px;border-radius:50%;background:var(--emerald);box-shadow:0 0 0 0 rgba(55,224,160,.5);animation:pp 2s infinite}
  @keyframes pp{0%{box-shadow:0 0 0 0 rgba(55,224,160,.45)}70%{box-shadow:0 0 0 8px rgba(55,224,160,0)}100%{box-shadow:0 0 0 0 rgba(55,224,160,0)}}

  /* ===== SIDEBAR ===== */
  .sidebar{grid-area:side;border-inline-end:1px solid var(--line);background:rgba(8,12,24,.5);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);padding:18px 14px;display:flex;flex-direction:column;gap:4px;overflow-y:auto}
  .nav-group-t{font-size:10.5px;color:var(--muted-dim);font-weight:600;letter-spacing:1px;padding:14px 12px 6px}
  .nav-item{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:12px;cursor:pointer;color:var(--muted);font-size:14px;font-weight:500;transition:background .18s,color .18s;border:1px solid transparent;position:relative}
  .nav-item svg{width:19px;height:19px;flex-shrink:0;stroke-width:1.6}
  .nav-item:hover{background:rgba(122,160,255,.06);color:var(--text)}
  .nav-item.active{background:linear-gradient(100deg,rgba(52,229,255,.14),rgba(157,123,255,.10));color:#fff;border-color:var(--line-strong)}
  .nav-item.active::before{content:"";position:absolute;inset-inline-start:-14px;top:50%;transform:translateY(-50%);width:3px;height:22px;border-radius:4px;background:linear-gradient(var(--cyan),var(--violet));box-shadow:0 0 12px var(--cyan)}
  .nav-item .badge{margin-inline-start:auto;font-family:var(--num);font-size:11px;background:rgba(255,255,255,.07);padding:1px 8px;border-radius:20px;color:var(--muted)}
  .nav-item.active .badge{background:rgba(52,229,255,.18);color:var(--cyan)}
  .sb-foot{margin-top:auto;padding:14px 12px 4px;font-size:11px;color:var(--muted-dim);line-height:1.7}
  .sb-foot .guard{display:flex;align-items:center;gap:7px;color:var(--emerald);margin-bottom:6px;font-weight:600;font-size:11.5px}
  .sb-foot .guard svg{width:14px;height:14px}

  /* ===== MAIN ===== */
  .main{grid-area:main;overflow-y:auto;padding:26px 30px 60px;position:relative}
  .panel{display:none;animation:fade .4s ease}
  .panel.on{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .phead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
  .phead h1{font-size:25px;font-weight:700;letter-spacing:-.2px}
  .phead p{color:var(--muted);font-size:13.5px;margin-top:4px;max-width:60ch}
  .src-tag{display:inline-flex;align-items:center;gap:6px;font-family:var(--num);font-size:11px;color:var(--cyan-dim);background:rgba(52,229,255,.06);border:1px solid rgba(52,229,255,.16);padding:4px 10px;border-radius:8px}
  .src-tag svg{width:12px;height:12px}

  /* cards */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:20px}
  .grid{display:grid;gap:16px}
  .g-2{grid-template-columns:repeat(2,1fr)}
  .g-3{grid-template-columns:repeat(3,1fr)}
  .g-4{grid-template-columns:repeat(4,1fr)}
  .g-5{grid-template-columns:repeat(5,1fr)}

  /* ===== OVERVIEW / CORE ===== */
  .core-wrap{display:grid;grid-template-columns:1.15fr .85fr;gap:20px;margin-bottom:20px}
  .core-stage{position:relative;border-radius:22px;border:1px solid var(--line);overflow:hidden;min-height:340px;background:radial-gradient(120% 90% at 50% 40%,rgba(52,229,255,.05),transparent 70%),linear-gradient(180deg,rgba(13,20,40,.4),rgba(8,12,24,.6))}
  #coreCanvas{position:absolute;inset:0;width:100%;height:100%}
  .core-hud{position:absolute;inset:0;padding:20px;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}
  .core-hud .top{display:flex;justify-content:space-between;align-items:flex-start}
  .core-title{font-size:13px;color:var(--muted)}
  .core-title b{display:block;font-size:20px;color:#fff;font-weight:700;margin-top:2px}
  .core-state{display:flex;align-items:center;gap:8px;background:rgba(6,9,18,.6);border:1px solid rgba(55,224,160,.3);border-radius:20px;padding:6px 13px;font-size:12.5px;color:var(--emerald);font-weight:600;backdrop-filter:blur(8px)}
  .core-metrics{display:flex;gap:22px;flex-wrap:wrap}
  .cm{}
  .cm .n{font-family:var(--num);font-size:26px;font-weight:600;color:#fff;line-height:1}
  .cm .l{font-size:11.5px;color:var(--muted);margin-top:4px}
  .cm.cy .n{color:var(--cyan)} .cm.vi .n{color:var(--violet)} .cm.go .n{color:var(--gold)}

  .side-stack{display:flex;flex-direction:column;gap:16px}
  .prov-box .ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .prov-box .ph b{font-size:14px}
  .prov-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
  .prov-row:last-child{border-bottom:0}
  .prov-row .st{width:8px;height:8px;border-radius:50%}
  .st.up{background:var(--emerald);box-shadow:0 0 8px var(--emerald)}
  .st.warn{background:var(--gold);box-shadow:0 0 8px var(--gold)}
  .st.down{background:var(--muted-dim)}
  .st.off{background:var(--coral)}
  .prov-row .nm{font-size:13.5px;font-weight:500}
  .prov-row .tag{margin-inline-start:auto;font-size:11px;color:var(--muted);font-family:var(--num)}
  .prov-row .badge-live{color:var(--emerald)} .prov-row .badge-off{color:var(--coral)}

  /* stat cards */
  .stat{position:relative;border-radius:16px;border:1px solid var(--line);background:var(--panel);padding:18px;overflow:hidden;transition:transform .25s,border-color .25s;cursor:default}
  .stat:hover{transform:translateY(-3px);border-color:var(--line-strong)}
  .stat .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;margin-bottom:14px;border:1px solid var(--line)}
  .stat .ic svg{width:19px;height:19px;stroke-width:1.7}
  .stat .val{font-family:var(--num);font-size:30px;font-weight:600;line-height:1}
  .stat .lab{font-size:12.5px;color:var(--muted);margin-top:6px}
  .stat .sub{font-size:11px;color:var(--muted-dim);margin-top:8px;font-family:var(--num)}
  .stat .beam{position:absolute;inset-block:0;inset-inline-start:0;width:3px;border-radius:4px}
  .tc-cyan{color:var(--cyan)} .bg-cyan{background:rgba(52,229,255,.10)} .bm-cyan{background:linear-gradient(var(--cyan),transparent)}
  .tc-violet{color:var(--violet)} .bg-violet{background:rgba(157,123,255,.10)} .bm-violet{background:linear-gradient(var(--violet),transparent)}
  .tc-gold{color:var(--gold)} .bg-gold{background:rgba(246,196,83,.10)} .bm-gold{background:linear-gradient(var(--gold),transparent)}
  .tc-emerald{color:var(--emerald)} .bg-emerald{background:rgba(55,224,160,.10)} .bm-emerald{background:linear-gradient(var(--emerald),transparent)}
  .tc-coral{color:var(--coral)} .bg-coral{background:rgba(255,107,138,.10)} .bm-coral{background:linear-gradient(var(--coral),transparent)}

  /* section title */
  .sec-t{display:flex;align-items:center;gap:10px;margin:26px 0 14px;font-size:15px;font-weight:600}
  .sec-t .ln{flex:1;height:1px;background:var(--line)}

  /* activity feed */
  .feed{display:flex;flex-direction:column}
  .feed-row{display:flex;gap:14px;padding:12px 0;border-bottom:1px dashed var(--line)}
  .feed-row:last-child{border-bottom:0}
  .feed-row .lvl{width:8px;height:8px;border-radius:50%;margin-top:7px;flex-shrink:0}
  .lvl.info{background:var(--cyan)} .lvl.warn{background:var(--gold)} .lvl.critical{background:var(--coral)}
  .feed-row .body{flex:1}
  .feed-row .ev{font-size:13.5px}
  .feed-row .meta{font-size:11px;color:var(--muted-dim);font-family:var(--num);margin-top:3px;display:flex;gap:10px}

  /* ===== CHAT ===== */
  .chat-wrap{display:grid;grid-template-columns:1fr 300px;gap:18px;height:calc(100vh - 156px)}
  .chat-main{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:18px;background:var(--panel);overflow:hidden}
  .chat-scroll{flex:1;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:16px}
  .msg{max-width:74%;padding:12px 16px;border-radius:16px;font-size:14px;line-height:1.7;position:relative;animation:fade .3s ease}
  .msg.me{align-self:flex-start;background:linear-gradient(135deg,rgba(52,229,255,.16),rgba(157,123,255,.12));border:1px solid var(--line-strong);border-bottom-inline-start:4px solid var(--cyan)}
  .msg.bot{align-self:flex-end;background:rgba(255,255,255,.03);border:1px solid var(--line)}
  .msg .who{font-size:11px;color:var(--muted);margin-bottom:5px;font-weight:600}
  .step-line{align-self:flex-end;max-width:78%;display:flex;gap:11px;align-items:flex-start;padding:9px 14px;background:rgba(9,14,28,.5);border:1px solid var(--line);border-radius:13px;font-size:13px;animation:fade .3s ease}
  .step-line .sdot{width:20px;height:20px;border-radius:7px;flex-shrink:0;display:grid;place-items:center;background:rgba(52,229,255,.12);color:var(--cyan);font-family:var(--num);font-size:11px;font-weight:600;margin-top:1px}
  .step-line .stx{color:var(--muted)}
  .step-line.done .sdot{background:rgba(55,224,160,.14);color:var(--emerald)}
  .step-line.done .stx{color:var(--emerald);font-weight:600}
  .chat-input{border-top:1px solid var(--line);padding:14px 16px;display:flex;gap:12px;align-items:flex-end;background:rgba(8,12,24,.5)}
  .chat-input textarea{flex:1;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:13px;color:var(--text);font-family:var(--ar);font-size:14px;padding:12px 15px;resize:none;height:48px;max-height:130px;line-height:1.6;transition:border-color .2s}
  .chat-input textarea:focus{outline:none;border-color:rgba(52,229,255,.4)}
  .send-btn{width:48px;height:48px;border-radius:13px;border:1px solid var(--line-strong);background:linear-gradient(135deg,var(--cyan),var(--violet));display:grid;place-items:center;cursor:pointer;flex-shrink:0;transition:transform .15s,box-shadow .2s;box-shadow:0 6px 20px rgba(52,229,255,.25)}
  .send-btn:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(52,229,255,.4)}
  .send-btn:active{transform:translateY(0)}
  .send-btn svg{width:20px;height:20px;stroke:#04121a;stroke-width:2}
  .send-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
  .chat-side{display:flex;flex-direction:column;gap:14px}
  .csbox{border:1px solid var(--line);border-radius:15px;background:var(--panel);padding:16px}
  .csbox h4{font-size:12px;color:var(--muted);margin-bottom:12px;font-weight:600;letter-spacing:.3px}
  .kv{display:flex;justify-content:space-between;padding:7px 0;font-size:13px;border-bottom:1px dashed var(--line)}
  .kv:last-child{border-bottom:0}
  .kv .k{color:var(--muted)}
  .kv .v{font-family:var(--num);font-weight:600}
  .quick-cmds{display:flex;flex-direction:column;gap:8px}
  .qcmd{text-align:start;padding:10px 13px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.02);color:var(--text);font-size:13px;cursor:pointer;transition:background .18s,border-color .18s;font-family:var(--ar)}
  .qcmd:hover{background:rgba(52,229,255,.07);border-color:var(--line-strong)}
  .qcmd code{font-family:var(--num);font-size:11.5px;color:var(--cyan);display:block;margin-top:2px}

  /* ===== LISTS / ROWS ===== */
  .list{display:flex;flex-direction:column;gap:12px}
  .row-card{border:1px solid var(--line);border-radius:15px;background:var(--panel);padding:17px 19px;transition:border-color .2s}
  .row-card:hover{border-color:var(--line-strong)}
  .rc-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
  .rc-title{font-size:15px;font-weight:600}
  .rc-desc{font-size:13px;color:var(--muted);margin-top:5px;line-height:1.7}
  .pill{font-size:11px;padding:3px 11px;border-radius:20px;font-weight:600;white-space:nowrap;font-family:var(--ar)}
  .pill.active,.pill.validated,.pill.ready,.pill.built,.pill.up{background:rgba(55,224,160,.12);color:var(--emerald);border:1px solid rgba(55,224,160,.25)}
  .pill.pending{background:rgba(246,196,83,.12);color:var(--gold);border:1px solid rgba(246,196,83,.25)}
  .pill.paused,.pill.denied,.pill.rejected,.pill.duplicate{background:rgba(255,107,138,.1);color:var(--coral);border:1px solid rgba(255,107,138,.22)}
  .pill.high{background:rgba(255,107,138,.12);color:var(--coral);border:1px solid rgba(255,107,138,.25)}
  .pill.medium{background:rgba(246,196,83,.12);color:var(--gold);border:1px solid rgba(246,196,83,.25)}
  .pill.low{background:rgba(52,229,255,.1);color:var(--cyan);border:1px solid rgba(52,229,255,.22)}
  .pill.neutral{background:rgba(255,255,255,.05);color:var(--muted);border:1px solid var(--line)}
  .btn{padding:8px 16px;border-radius:11px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--text);transition:all .18s;font-family:var(--ar)}
  .btn:hover{border-color:var(--line-strong);background:rgba(255,255,255,.06)}
  .btn.primary{background:linear-gradient(135deg,rgba(52,229,255,.22),rgba(157,123,255,.18));border-color:var(--line-strong);color:#fff}
  .btn.primary:hover{box-shadow:0 6px 18px rgba(52,229,255,.25)}
  .btn.good{color:var(--emerald);border-color:rgba(55,224,160,.3);background:rgba(55,224,160,.06)}
  .btn.good:hover{background:rgba(55,224,160,.14)}
  .btn.bad{color:var(--coral);border-color:rgba(255,107,138,.3);background:rgba(255,107,138,.06)}
  .btn.bad:hover{background:rgba(255,107,138,.14)}
  .btn.sm{padding:6px 12px;font-size:12px}
  .btn-row{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
  .chip{font-family:var(--num);font-size:11.5px;padding:4px 10px;border-radius:8px;background:rgba(255,255,255,.03);border:1px solid var(--line);color:var(--muted)}
  .chip.lock{color:var(--emerald);border-color:rgba(55,224,160,.2)}

  /* finance */
  .money-hero{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:8px}
  .fin-big{grid-column:span 2;padding:24px}
  .fin-big .lab{font-size:13px;color:var(--muted)}
  .fin-big .amt{font-family:var(--num);font-size:44px;font-weight:600;margin-top:8px;line-height:1}
  .fin-big .amt small{font-size:20px;color:var(--muted);font-weight:400}
  .bar-track{height:9px;border-radius:20px;background:rgba(255,255,255,.05);overflow:hidden;margin-top:18px}
  .bar-fill{height:100%;border-radius:20px;background:linear-gradient(90deg,var(--emerald),var(--cyan))}
  .txn{display:flex;align-items:center;gap:13px;padding:12px 0;border-bottom:1px dashed var(--line)}
  .txn:last-child{border-bottom:0}
  .txn .ti{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex-shrink:0}
  .txn .ti svg{width:16px;height:16px;stroke-width:1.8}
  .txn .info{flex:1}
  .txn .info .t{font-size:13.5px;font-weight:500}
  .txn .info .m{font-size:11px;color:var(--muted-dim);font-family:var(--num);margin-top:2px}
  .txn .amt{font-family:var(--num);font-weight:600;font-size:15px}

  /* settings */
  .seg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .seg button{padding:10px 18px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.02);color:var(--muted);cursor:pointer;font-size:13.5px;font-weight:500;transition:all .18s;font-family:var(--ar)}
  .seg button.on{background:linear-gradient(135deg,rgba(52,229,255,.16),rgba(157,123,255,.12));color:#fff;border-color:var(--line-strong)}
  .set-row{display:flex;align-items:center;justify-content:space-between;padding:16px 0;border-bottom:1px dashed var(--line);gap:20px}
  .set-row:last-child{border-bottom:0}
  .set-row .sl{font-size:14px;font-weight:500}
  .set-row .sd{font-size:12px;color:var(--muted);margin-top:3px;max-width:52ch}
  .toggle{width:48px;height:27px;border-radius:20px;background:rgba(255,255,255,.08);border:1px solid var(--line);cursor:pointer;position:relative;flex-shrink:0;transition:background .2s}
  .toggle.on{background:linear-gradient(90deg,var(--cyan),var(--violet))}

  .toggle.on::after{inset-inline-end:23px}

function addChat(html, keep=false){

function escA(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function sendMsg(){
  const inp=$('#chatInput'); if(!inp||chatBusy) return;
  const txt=inp.value.trim(); if(!txt) return;
  inp.value=''; autoGrow(inp); chatBusy=true; $('#sendBtn').disabled=true;
  addChat(`<div class="msg me"><div class="who">أنت</div>${txt}</div>`, true);

  const execEl=document.getElementById('execToggle');
  if(execEl && execEl.checked){
    addChat(`<div class="msg bot"><div class="who">Agent OS</div><span class="mono" style="color:var(--cyan)">أُرسلت المهمة إلى منفّذ الخلفية ⏳ — سينفّذها ويجيبك هنا مباشرةً حين تنتهي.</span></div>`, true);
    chatBusy=false; $('#sendBtn').disabled=false;
    pushAction('task',{text:txt});
    trackTaskReply(txt);
    return;
  }

  addChat(`<div class="msg bot" id="cTyping"><div class="who">Agent OS</div><span class="mono" style="color:var(--muted)">يكتب الآن…</span></div>`);

  const t0=Date.now();

    const typing=document.getElementById('cTyping'); if(typing) typing.remove();
    if(res && res.ok && res.reply){
      const engine=escA(res.engine||'Gemini');

    chatBusy=false; $('#sendBtn').disabled=false;
  });
}
function pickSteps(t){
  const base=['ROUTER: تحليل القصد وتحديد الخلايا المناسبة','PLANNER: تفكيك المهمة إلى خطوات قابلة للتنفيذ'];
  let mid=[];
  if(/موقع|هبوط|ابن|بناء|منتج/.test(t)) mid=['EXECUTOR: تشغيل product_factory بقالب web','كتابة الملفات في output/products/','تشغيل فحص سريع على البناء'];
  else if(/مكاف|صيد|ثغر|bounty/.test(t)) mid=['bounty_sync: سحب الأدلة من 6 منصات','ترتيب المرشحين تنازلياً بالمكافأة','bounty_engine: توليد خطة صيد 5 مراحل'];
  else if(/مال|تقرير|رصيد|finance/.test(t)) mid=['finance_intel: قراءة الحركات من finance.json','حساب الإيرادات والمصروف وROI','تحديد أفضل مصدر ربح'];
  else if(/حسّن|حسن|طور|improve/.test(t)) mid=['benchmark: قياس 12 مجالاً وتحديد الأضعف','self_improve_engine: توليد تعديل في فرع معزول','تشغيل pytest للتحقق (252 اختبار)'];
  else mid=['EXECUTOR: تنفيذ الخطوات على الخلايا','جمع النتائج من الأدوات المعنية'];
  return [...base,...mid,'CRITIC: مراجعة الجودة والمخاطر','VERIFIER: تأكيد المخرجات النهائية'];
}
function finalReply(t){
  if(/موقع|هبوط|ابن|بناء|منتج/.test(t)) return 'جاهز ✅ بنيت لك المشروع في <span class="mono" style="color:var(--cyan)">output/products/</span> واجتاز الفحص السريع. تقدر تفتح المجلد أو تطلب نشره من لوحة الموافقات.';
  if(/مكاف|صيد|ثغر|bounty/.test(t)) return 'سحبت أحدث البرامج ورتّبتها بالمكافأة، وجهّزت خطة صيد من ٥ مراحل. شوف <b>لوحة المكافآت</b> لاعتماد برنامج وعرض الخطة. تذكير: الرفع يدوي دائماً.';
  if(/مال|تقرير|رصيد|finance/.test(t)) return 'صافي الرصيد موجب، وأفضل مصدر ربح حالياً هو <b>bounty</b>. التفاصيل الكاملة في <b>لوحة المال</b>.';
  if(/حسّن|حسن|طور|improve/.test(t)) return 'قِست الأداء، والأضعف كان في تصنيف القصد. جهّزت تعديلاً في فرع معزول واجتاز ٢٥٢ اختباراً — ينتظر موافقتك للدمج في <b>لوحة الموافقات</b>.';
  return 'نفّذت المهمة وجمعت النتائج. تقدر تعطيني تفاصيل أكثر أو مهمة جديدة.';
}

let current='overview';
function render(panel){

/* ==================== 3D: BACKGROUND STARFIELD ==================== */
(function bgScene(){
  const canvas=$('#bg3d');
  if(!window.THREE) return;
  const reduce=window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  const renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  const scene=new THREE.Scene();
  const cam=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,1000);
  cam.position.z=340;

  // star particles
  const N=1400, geo=new THREE.BufferGeometry(), pos=new Float32Array(N*3), col=new Float32Array(N*3);
  const cA=new THREE.Color(0x34e5ff), cB=new THREE.Color(0x9d7bff), cC=new THREE.Color(0xffffff);
  for(let i=0;i<N;i++){
    pos[i*3]=(Math.random()-.5)*900; pos[i*3+1]=(Math.random()-.5)*700; pos[i*3+2]=(Math.random()-.5)*700;
    const c=Math.random()<.5?cA:(Math.random()<.6?cB:cC);
    col[i*3]=c.r; col[i*3+1]=c.g; col[i*3+2]=c.b;
  }
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  geo.setAttribute('color',new THREE.BufferAttribute(col,3));
  const mat=new THREE.PointsMaterial({size:1.7,vertexColors:true,transparent:true,opacity:.7,depthWrite:false,blending:THREE.AdditiveBlending});
  const stars=new THREE.Points(geo,mat); scene.add(stars);

  let mx=0,my=0;
  addEventListener('mousemove',e=>{mx=(e.clientX/innerWidth-.5);my=(e.clientY/innerHeight-.5);});
  function resize(){renderer.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();}
  addEventListener('resize',resize); resize();
  function loop(){
    requestAnimationFrame(loop);
    stars.rotation.y+=reduce?0:.0004; stars.rotation.x+=reduce?0:.0002;
    cam.position.x+=(mx*40-cam.position.x)*.03; cam.position.y+=(-my*40-cam.position.y)*.03;
    cam.lookAt(scene.position);
    renderer.render(scene,cam);
  }
  loop();
})();

/* ==================== 3D: LIVING CORE ==================== */
let coreCtx=null;
function initCore(){
  const canvas=$('#coreCanvas'); if(!canvas||!window.THREE) return;
  if(coreCtx){ coreCtx.dispose(); coreCtx=null; }
  const reduce=window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  const renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  const scene=new THREE.Scene();
  const w=canvas.clientWidth||600, h=canvas.clientHeight||340;
  const cam=new THREE.PerspectiveCamera(55,w/h,.1,100); cam.position.z=6;

  const grp=new THREE.Group(); scene.add(grp);

  // inner glowing icosahedron (solid)
  const innerGeo=new THREE.IcosahedronGeometry(1.35,1);
  const innerMat=new THREE.MeshBasicMaterial({color:0x1a4a66,transparent:true,opacity:.35});
  const inner=new THREE.Mesh(innerGeo,innerMat); grp.add(inner);

  // wireframe shell
  const wireGeo=new THREE.IcosahedronGeometry(1.9,2);
  const wireMat=new THREE.MeshBasicMaterial({color:0x34e5ff,wireframe:true,transparent:true,opacity:.55});
  const wire=new THREE.Mesh(wireGeo,wireMat); grp.add(wire);

  // outer violet wire
  const wire2Geo=new THREE.IcosahedronGeometry(2.5,1);
  const wire2Mat=new THREE.MeshBasicMaterial({color:0x9d7bff,wireframe:true,transparent:true,opacity:.22});
  const wire2=new THREE.Mesh(wire2Geo,wire2Mat); grp.add(wire2);

  // orbiting points
  const M=420, pg=new THREE.BufferGeometry(), pp=new Float32Array(M*3), pc=new Float32Array(M*3);
  const cCy=new THREE.Color(0x34e5ff), cVi=new THREE.Color(0x9d7bff), cGo=new THREE.Color(0xf6c453);
  for(let i=0;i<M;i++){
    const r=2.7+Math.random()*1.6, th=Math.random()*Math.PI*2, ph=Math.acos(2*Math.random()-1);
    pp[i*3]=r*Math.sin(ph)*Math.cos(th); pp[i*3+1]=r*Math.sin(ph)*Math.sin(th); pp[i*3+2]=r*Math.cos(ph);
    const c=Math.random()<.6?cCy:(Math.random()<.6?cVi:cGo);
    pc[i*3]=c.r; pc[i*3+1]=c.g; pc[i*3+2]=c.b;
  }
  pg.setAttribute('position',new THREE.BufferAttribute(pp,3));
  pg.setAttribute('color',new THREE.BufferAttribute(pc,3));
  const pm=new THREE.PointsMaterial({size:.06,vertexColors:true,transparent:true,opacity:.9,blending:THREE.AdditiveBlending,depthWrite:false});
  const orbit=new THREE.Points(pg,pm); scene.add(orbit);

  function rs(){ const W=canvas.clientWidth,H=canvas.clientHeight; renderer.setSize(W,H,false); cam.aspect=W/H; cam.updateProjectionMatrix(); }
  const ro=new ResizeObserver(rs); ro.observe(canvas); rs();

  let t=0, raf;
  function loop(){
    raf=requestAnimationFrame(loop); t+=.016;
    const pulse=1+Math.sin(t*1.6)*.05;
    grp.scale.setScalar(reduce?1:pulse);
    if(!reduce){
      wire.rotation.y+=.004; wire.rotation.x+=.002;
      wire2.rotation.y-=.003; wire2.rotation.z+=.002;
      inner.rotation.y-=.005;
      orbit.rotation.y+=.0016; orbit.rotation.x+=.0009;
    }
    wireMat.opacity=.45+Math.sin(t*1.6)*.12;
    renderer.render(scene,cam);
  }
  loop();
  coreCtx={dispose(){cancelAnimationFrame(raf);ro.disconnect();renderer.dispose();innerGeo.dispose();wireGeo.dispose();wire2Geo.dispose();pg.dispose();}};
}

/* ==================== LIVE BRIDGE ==================== */
/* يتصل تلقائياً بخادم الجسر المحلي إن كان شغّالاً، وإلا يبقى وضع تجريبي.
   عنوان الجسر الافتراضي: http://127.0.0.1:8787  (محلي فقط — لا إنترنت خارجي) */
const API_BASE = (location.protocol==='file:') ? 'http://127.0.0.1:8787' : '';
let LIVE = false;

async function loadLive(){
  try{
    const r = await fetch(API_BASE + '/api/all', {cache:'no-store'});
    if(!r.ok) throw new Error('bridge');
    const live = await r.json();
    const keys=['world','providers','finance','goals','requests','bountyPrograms',
      'bountyFindings','bountyCandidates','platformCounts','bountyDrafts',
      'bountyAccounts','products','notifications','events','settings','fullAccess','knowledge'];
    for(const k of keys){ if(live[k]!==undefined && live[k]!==null) DATA[k]=live[k]; }
    LIVE = true; setMode(true);
    if(DATA.fullAccess) FULL_ACCESS=!!DATA.fullAccess.enabled;
    renderAccess();
    const cur = document.querySelector('.nav-item.active')?.dataset.panel || 'overview';
    render(cur); refreshBadges();
    toast('اتصلت ببيانات وكيلك الحقيقية ✓','good');
  }catch(e){ LIVE=false; setMode(false); }
}
function setMode(on){
  const pill=document.querySelector('.live-pill');
  if(pill) pill.innerHTML='<span class="pulse"></span> '+(on?'بيانات مباشرة · الوكيل نشط':'وضع تجريبي');
}
async function pushAction(type,payload){
  try{
    const r=await fetch(API_BASE+'/api/action',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({type,payload})});
    if(!r.ok) return null;
    const res=await r.json();
    if(res && res.ok===false) toast(res.message||'تعذّر تنفيذ الإجراء','warn');
    return res;
  }catch(e){ return null; }
}
window.loadLive=loadLive; window.pushAction=pushAction;

/* ==================== الرد الحي: تتبّع نتيجة المهمة ==================== */
let PENDING_TASK=null;        // {text, baseTotal}
let RESULT_POLL=null;
let lastLive='';
function appendLive(cur){
  cur=String(cur||'').trim();
  if(!cur){ const wb=document.getElementById('cLive'); if(wb) wb.remove(); lastLive=''; return; }
  if(cur===lastLive) return;
  lastLive=cur;
  const wb=document.getElementById('cLive');
  if(wb){ wb.innerHTML=`<span class="mono" style="color:var(--cyan)">⚙ الآن: ${escA(cur)}</span>`; wb.scrollIntoView({block:'nearest'}); }
  else addChat(`<div class="msg bot" id="cLive"><div class="who">Agent OS · live</div><span class="mono" style="color:var(--cyan)">⚙ يعمل الآن: ${escA(cur)}</span></div>`);
}
async function pollWorkerLive(){
  try{
    const r=await fetch(API_BASE+'/api/worker',{cache:'no-store'});
    if(!r.ok){ return; }
    const w=await r.json();
    appendLive(w.current||'');
  }catch(e){}
}
async function trackTaskReply(text){
  let baseTotal=0;
  try{
    const r=await fetch(API_BASE+'/api/inbox_results',{cache:'no-store'});
    if(r.ok){ const j=await r.json(); baseTotal=j.total||0; }
  }catch(e){ baseTotal=0; }
  const baseText=String(text||'').trim().slice(0,120);
  PENDING_TASK={text:baseText, baseTotal};
  if(RESULT_POLL) clearInterval(RESULT_POLL);
  RESULT_POLL=setInterval(async()=>{
    if(!PENDING_TASK) { clearInterval(RESULT_POLL); RESULT_POLL=null; appendLive(''); return; }
    pollWorkerLive();
    try{
      const r=await fetch(API_BASE+'/api/inbox_results',{cache:'no-store'});
      if(!r.ok) return;
      const j=await r.json();
      const total=j.total||0;
      if(total<=PENDING_TASK.baseTotal) return;
      const now=j.items||[];
      const hit=now.find(x=>String(x.text||'').trim().slice(0,120)===PENDING_TASK.text);
      const latest=now.length?now[0]:null;
      const found=hit||latest;
      if(!found) return;
      PENDING_TASK=null;
      clearInterval(RESULT_POLL); RESULT_POLL=null;
      appendLive('');
      const ok = found.ok===false?'warn':'good';
      const kindTxt = found.kind==='learned'?'تعلمت ✓':(found.kind==='executed'?'نفّذت المهمة ✓':'نتيجة المهمة');
      const detail=String(found.detail||'').replace(/^\{/,'{ ');
      addChat(`<div class="msg bot"><div class="who">Agent OS</div><span class="mono" style="color:${found.ok===false?'#ff9d6b':'var(--cyan)'}"><b>${kindTxt}</b><br><small>${escA(detail.slice(0,260))}</small></span></div>`, true);
      toast(kindTxt + (found.ok===false?' (انظر التفاصيل)':''), ok);
    }catch(e){/* يبقى الرصد صامتاً حتى النتيجة */}
  }, 4000);
}
window.trackTaskReply=trackTaskReply;

/* ==================== الولوج الكامل (مثل جارفس) ==================== */
let FULL_ACCESS=true;   // تلقائي ودائم افتراضياً — كما طلب المستخدم
function renderAccess(){
  const el=document.getElementById('accLabel'), dot=document.getElementById('accDot');
  if(!el) return;
  if(FULL_ACCESS){ el.textContent='الولوج: كامل 🕹️'; if(dot) dot.style.background='#37d0c4'; }
  else { el.textContent='الولوج: مقيّد'; if(dot) dot.style.background='#5a6b7d'; }
}
async function toggleAccess(){
  const on=!FULL_ACCESS;
  if(on){
    const ok=confirm(
      '⚠️ تفعيل الولوج الكامل — منح الوكيل صلاحية تنفيذ أوامر مباشرة على جهازك بلا موافقة لكل خطوة.\n\n' +
      '· الأوامر القاتلة (حذف/تهيئة/إيقاف تشغيل/reg) تبقى محجوبة دائماً\n' +
      '· لا كلمات مرور ولا مفاتيح تُسرّب — المفاعيل تبقى في .env\n' +
      '· يمكنك تعطيله بنفس الزر في أي لحظة\n\nهل تتحمّل هذا؟'
    );
    if(!ok) return;
  }
  const res=await pushAction('access',{enable:on, reason:'من اللوحة'});
  if(res && res.ok && res.access) FULL_ACCESS=!!res.access.enabled;
  renderAccess();
}
